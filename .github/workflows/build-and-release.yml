name: Build, Test & Pack Extension

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-and-pack:
    name: Build, Test & Pack
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (if any)
        run: npm install --no-audit --prefer-offline || true

      - name: Run Test Suite
        run: npm test

      - name: Build Chrome & Firefox Extensions
        run: npm run build

      - name: Lint Firefox Add-on
        run: npx --yes addons-linter firefox/

      - name: Pack Chrome Extension (.crx) with Key
        env:
          CHROME_PRIVATE_KEY: ${{ secrets.CHROME_PRIVATE_KEY }}
        run: |
          if [ -n "$CHROME_PRIVATE_KEY" ]; then
            echo "Packaging Chrome Extension signed with private key..."
            echo "$CHROME_PRIVATE_KEY" > key.pem
            npx --yes crx3 -p key.pem -o work-tracker-chrome.crx chrome/
            rm -f key.pem
            echo "✓ Created work-tracker-chrome.crx"
          else
            echo "⚠️ CHROME_PRIVATE_KEY secret is not set. Skipping .crx signing."
          fi

      - name: Create Zip Archives
        run: |
          (cd chrome && zip -r ../work-tracker-chrome.zip .)
          (cd firefox && zip -r ../work-tracker-firefox.zip .)
          echo "✓ Created work-tracker-chrome.zip and work-tracker-firefox.zip"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-packages
          path: |
            *.crx
            work-tracker-chrome.zip
            work-tracker-firefox.zip
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.crx
            work-tracker-chrome.zip
            work-tracker-firefox.zip
